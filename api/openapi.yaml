openapi: 3.0.3
info:
  title: Infersoft REST API
  version: 1.0.0
servers:
- url: https://api.infersoft.com
paths:
  /api/uploads:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchUploadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUploadResponse"
          description: Planned upload URLs
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Payload too large
      security:
      - oauth2:
        - files:upload
      summary: "Plan batch uploads (single-part, via CloudFront URL)"
  /api/documents/search:
    post:
      description: |
        If `selectors` is omitted, or both `selectors.include` and `selectors.exclude` are present but empty, **no filters** are applied (all documents in the org), subject to pagination.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentQueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentQueryResponse"
          description: Documents page
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      security:
      - oauth2:
        - documents:read
      summary: Query documents by selectors (paged)
  /api/documents/{id}:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSummary"
          description: Document
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found
      security:
      - oauth2:
        - documents:read
      summary: Get a document by ID
  /api/projects:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          description: Created
          headers:
            Location:
              explode: false
              schema:
                type: string
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      security:
      - oauth2:
        - projects:write
      summary: Create a project
  /api/projects/search:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectQueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectQueryResponse"
          description: Projects page
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      security:
      - oauth2:
        - projects:read
      summary: "Query projects (fuzzy by name, paged)"
  /api/projects/{id}:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          description: Project
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found
      security:
      - oauth2:
        - projects:read
      summary: Get a project by ID
  /api/projects/assign-documents:
    post:
      description: |
        `selectors` uses the same structure as document search. If both lists are empty, servers MAY treat it as a no-op (assign 0 documents).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_projects_assign_documents_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignDocumentsResponse"
          description: Assignment result
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Project not found when projectId is provided
      security:
      - oauth2:
        - projects:write
        - documents:read
      summary: Assign documents to a project (create a new project when projectName
        is provided)
  /api/prompts/search:
    post:
      description: |
        Returns extractor prompts. Excludes deleted prompts unless `includeDeleted` is true.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptQueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptQueryResponse"
          description: Prompts page
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      security:
      - oauth2:
        - prompts:read
      summary: "Query prompts (org-owned + global), paged"
  /api/jobs/credits/estimate:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditsEstimateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditsEstimateResponse"
          description: Credits estimate
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - oauth2:
        - jobs:write
        - documents:read
        - projects:read
        - prompts:read
      summary: Estimate credits for a workflow request (no job creation)
  /api/jobs/start:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartJobRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Job created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal server error
      security:
      - oauth2:
        - jobs:write
        - documents:read
        - projects:read
        - prompts:read
      summary: Start a workflow job
  /api/jobs/{id}:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: Job
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found
      security:
      - oauth2:
        - jobs:read
      summary: Get a job by ID
  /api/jobs/search:
    post:
      description: |
        Filters by created_at range and/or a list of statuses. If neither filter is provided, all jobs in the organization are returned, subject to pagination. Sorting supports a computed field
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobQueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobQueryResponse"
          description: Jobs page
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      security:
      - oauth2:
        - jobs:read
      summary: "Search jobs (by created_at and statuses), paged"
  /api/documents/extraction_results/search:
    post:
      description: |
        Returns documents matched by `selectors` together with **nullable** extraction fields for the specified project (LEFT JOIN). A `projectSelector` **must** be present in `selectors.include`; otherwise servers SHOULD return 400.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractionResultsQueryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResultsQueryResponse"
          description: Document extraction results page
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Bad request (e.g., missing projectSelector)"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
      security:
      - oauth2:
        - documents:read
        - extraction:read
      summary: Query extraction results by selectors (paged)
components:
  schemas:
    BatchUploadRequest:
      additionalProperties: false
      example:
        files:
        - content_type: content_type
          size: 41986461
          file_name: file_name
        - content_type: content_type
          size: 41986461
          file_name: file_name
        - content_type: content_type
          size: 41986461
          file_name: file_name
        - content_type: content_type
          size: 41986461
          file_name: file_name
        - content_type: content_type
          size: 41986461
          file_name: file_name
      properties:
        files:
          items:
            $ref: "#/components/schemas/UploadFile"
          maxItems: 50
          minItems: 1
          type: array
      required:
      - files
      type: object
    UploadFile:
      additionalProperties: false
      example:
        content_type: content_type
        size: 41986461
        file_name: file_name
      properties:
        file_name:
          maxLength: 2048
          type: string
        content_type:
          maxLength: 255
          type: string
        size:
          maximum: 524288000
          minimum: 1
          type: integer
      required:
      - content_type
      - file_name
      - size
      type: object
    BatchUploadResponse:
      example:
        items:
        - expires_at: 2000-01-23T04:56:07.000+00:00
          upload_mode: upload_mode
          client_file_name: client_file_name
          required_headers:
            key: required_headers
          error: ""
          key: key
          put_url: https://openapi-generator.tech
        - expires_at: 2000-01-23T04:56:07.000+00:00
          upload_mode: upload_mode
          client_file_name: client_file_name
          required_headers:
            key: required_headers
          error: ""
          key: key
          put_url: https://openapi-generator.tech
      properties:
        items:
          items:
            $ref: "#/components/schemas/UploadItem"
          minItems: 1
          type: array
      required:
      - items
      type: object
    UploadItem:
      additionalProperties: false
      example:
        expires_at: 2000-01-23T04:56:07.000+00:00
        upload_mode: upload_mode
        client_file_name: client_file_name
        required_headers:
          key: required_headers
        error: ""
        key: key
        put_url: https://openapi-generator.tech
      properties:
        client_file_name:
          type: string
        key:
          description: raw/<org>/<file_name>
          type: string
        upload_mode:
          description: Currently 'single'; reserved for 'multipart' later
          type: string
        put_url:
          format: uri
          type: string
        required_headers:
          additionalProperties:
            type: string
          type: object
        expires_at:
          format: date-time
          type: string
        error:
          allOf:
          - $ref: "#/components/schemas/UploadError"
          nullable: true
      required:
      - client_file_name
      type: object
    UploadError:
      properties:
        code:
          enum:
          - FILE_TOO_LARGE
          - INVALID_FILENAME
          - INVALID_SIZE
          - NOT_AUTHORIZED
          - QUOTA_EXCEEDED
          - SIGN_URL_FAILED
          - INTERNAL
          type: string
        message:
          type: string
        file_size:
          type: integer
        max_size:
          type: integer
        retryable:
          type: boolean
      required:
      - code
      - message
      type: object
    Selectors:
      additionalProperties: false
      description: |
        Selector groups for documents. - If omitted, or both `include` and `exclude` are empty, **no filters** are applied. - `include` combines different selector **types** with logical AND. - `exclude` removes matches (each exclusion is combined with AND). - Each list (`include` and `exclude`) may contain **at most one** selector of each `type`
          (the same `type` may appear once in `include` **and** once in `exclude`).
        - **Time windows in `tagSelector` are inclusive on both ends** (`tagged_from` ≤ ts ≤ `tagged_to`)
          and operate on the `document_tags.created_at` timestamp.
      example:
        include:
        - project_id: 1
          linked_from: 2000-01-23T04:56:07.000+00:00
          type: projectSelector
          linked_to: 2000-01-23T04:56:07.000+00:00
        - project_id: 1
          linked_from: 2000-01-23T04:56:07.000+00:00
          type: projectSelector
          linked_to: 2000-01-23T04:56:07.000+00:00
        exclude:
        - null
        - null
      properties:
        include:
          default: []
          items:
            $ref: "#/components/schemas/Selector"
          type: array
        exclude:
          default: []
          items:
            $ref: "#/components/schemas/Selector"
          type: array
      type: object
      x-go-type: infstorage.Selectors
      x-go-type-import:
        path: github.com/InferSoft-inc/infer-lib/storage
        name: infstorage
    Selector:
      discriminator:
        mapping:
          projectSelector: "#/components/schemas/ProjectSelector"
          fileSelector: "#/components/schemas/FileSelector"
          tagSelector: "#/components/schemas/TagSelector"
          documentClassSelector: "#/components/schemas/DocumentClassSelector"
          createdAtSelector: "#/components/schemas/CreatedAtSelector"
          nameSelector: "#/components/schemas/NameSelector"
          sourceDocumentSelector: "#/components/schemas/SourceDocumentSelector"
          hasRunningWorkflowSelector: "#/components/schemas/HasRunningWorkflowSelector"
          isValidSelector: "#/components/schemas/IsValidSelector"
          pageCountSelector: "#/components/schemas/PageCountSelector"
          sizeSelector: "#/components/schemas/SizeSelector"
          jobSelector: "#/components/schemas/JobSelector"
          hasChildrenSelector: "#/components/schemas/HasChildrenSelector"
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/ProjectSelector"
      - $ref: "#/components/schemas/FileSelector"
      - $ref: "#/components/schemas/TagSelector"
      - $ref: "#/components/schemas/DocumentClassSelector"
      - $ref: "#/components/schemas/CreatedAtSelector"
      - $ref: "#/components/schemas/NameSelector"
      - $ref: "#/components/schemas/SourceDocumentSelector"
      - $ref: "#/components/schemas/HasRunningWorkflowSelector"
      - $ref: "#/components/schemas/IsValidSelector"
      - $ref: "#/components/schemas/PageCountSelector"
      - $ref: "#/components/schemas/SizeSelector"
      - $ref: "#/components/schemas/JobSelector"
      - $ref: "#/components/schemas/HasChildrenSelector"
      x-go-type: infstorage.Selector
      x-go-type-import:
        path: github.com/InferSoft-inc/infer-lib/storage
        name: infstorage
    ProjectSelector:
      additionalProperties: false
      description: |
        Select documents already linked to the given project. When a time window is provided, the link must satisfy: - only `linked_from`: `created_at >= linked_from` - only `linked_to`:   `created_at <= linked_to` - both provided:      `linked_from <= created_at <= linked_to` (both **inclusive**).
      example:
        project_id: 1
        linked_from: 2000-01-23T04:56:07.000+00:00
        type: projectSelector
        linked_to: 2000-01-23T04:56:07.000+00:00
      properties:
        type:
          enum:
          - projectSelector
          type: string
        project_id:
          minimum: 1
          type: integer
        linked_from:
          $ref: "#/components/schemas/ProjectSelector_linked_from"
        linked_to:
          $ref: "#/components/schemas/ProjectSelector_linked_to"
      required:
      - project_id
      - type
      type: object
    FileSelector:
      additionalProperties: false
      description: Select documents by explicit document IDs.
      properties:
        type:
          enum:
          - fileSelector
          type: string
        files:
          items:
            minimum: 1
            type: integer
          minItems: 1
          type: array
      required:
      - files
      - type
      type: object
    TagSelector:
      additionalProperties: false
      description: |
        Select documents that have at least one of the provided tag IDs. When a time window is provided, the match also requires the tag relation to have `document_tags.created_at` within the window. Bound semantics: - If only `tagged_from` is provided: select where `created_at >= tagged_from`. - If only `tagged_to`   is provided: select where `created_at <= tagged_to`. - If both are provided: select where `tagged_from <= created_at <= tagged_to` (both **inclusive**).
      properties:
        type:
          enum:
          - tagSelector
          type: string
        tags:
          items:
            minimum: 1
            type: integer
          minItems: 1
          type: array
        tagged_from:
          $ref: "#/components/schemas/TagSelector_tagged_from"
        tagged_to:
          $ref: "#/components/schemas/TagSelector_tagged_to"
      required:
      - tags
      - type
      type: object
    DocumentClassSelector:
      additionalProperties: false
      description: Select documents classified with any of the given class names.
      properties:
        type:
          enum:
          - documentClassSelector
          type: string
        classes:
          items:
            minLength: 1
            type: string
          minItems: 1
          type: array
      required:
      - classes
      - type
      type: object
    CreatedAtSelector:
      additionalProperties: false
      description: "Filter by document creation time (from inclusive, to exclusive).\
        \ At least one of `created_from` or `created_to` is required."
      properties:
        type:
          enum:
          - createdAtSelector
          type: string
        created_from:
          $ref: "#/components/schemas/CreatedAtSelector_created_from"
        created_to:
          $ref: "#/components/schemas/CreatedAtSelector_created_to"
      required:
      - type
      type: object
    NameSelector:
      additionalProperties: false
      description: Case-insensitive substring match on document name.
      properties:
        type:
          enum:
          - nameSelector
          type: string
        name:
          minLength: 1
          type: string
      required:
      - name
      - type
      type: object
    SourceDocumentSelector:
      additionalProperties: false
      description: "Select documents by their `source_document` (e.g., derived pages/parts\
        \ of a parent)."
      properties:
        type:
          enum:
          - sourceDocumentSelector
          type: string
        source_documents:
          items:
            minimum: 1
            type: integer
          minItems: 1
          type: array
      required:
      - source_documents
      - type
      type: object
    HasRunningWorkflowSelector:
      additionalProperties: false
      description: Select documents that currently have a workflow run in progress.
        Payload-less.
      properties:
        type:
          enum:
          - hasRunningWorkflowSelector
          type: string
      required:
      - type
      type: object
    IsValidSelector:
      additionalProperties: false
      description: Select documents where `is_valid = true`. Payload-less.
      properties:
        type:
          enum:
          - isValidSelector
          type: string
      required:
      - type
      type: object
    PageCountSelector:
      additionalProperties: false
      anyOf: []
      description: Filter by page count. At least one of `page_count_from` or `page_count_to`
        is required.
      nullable: true
      properties:
        type:
          enum:
          - pageCountSelector
          type: string
        page_count_from:
          description: Inclusive lower bound
          minimum: 0
          type: integer
        page_count_to:
          description: Exclusive upper bound
          minimum: 0
          type: integer
      required:
      - type
      type: object
    SizeSelector:
      additionalProperties: false
      anyOf: []
      description: Filter by file size (bytes). At least one of `size_from` or `size_to`
        is required.
      nullable: true
      properties:
        type:
          enum:
          - sizeSelector
          type: string
        size_from:
          description: Inclusive lower bound in bytes
          minimum: 0
          type: integer
        size_to:
          description: Exclusive upper bound in bytes
          minimum: 0
          type: integer
      required:
      - type
      type: object
    JobSelector:
      additionalProperties: false
      description: |
        Select documents linked to any of the provided Job IDs. In `include`, returns documents associated with those jobs. In `exclude`, removes documents associated with those jobs. (Backed by the document–job linkage created by the orchestrator.)
      properties:
        type:
          enum:
          - jobSelector
          type: string
        jobs:
          items:
            minimum: 1
            type: integer
          minItems: 1
          type: array
      required:
      - jobs
      - type
      type: object
    HasChildrenSelector:
      additionalProperties: false
      description: |
        Payload-less selector. In `include`, returns only documents that have at least one child (i.e., rows where an entry exists with `source_document = documents.id`). In `exclude`, removes documents that have children (leaving only leaf docs).
      properties:
        type:
          enum:
          - hasChildrenSelector
          type: string
      required:
      - type
      type: object
    DocumentQueryRequest:
      additionalProperties: false
      example:
        order_dir: asc
        order_by: id
        page: 1
        selectors:
          include:
          - project_id: 1
            linked_from: 2000-01-23T04:56:07.000+00:00
            type: projectSelector
            linked_to: 2000-01-23T04:56:07.000+00:00
          - project_id: 1
            linked_from: 2000-01-23T04:56:07.000+00:00
            type: projectSelector
            linked_to: 2000-01-23T04:56:07.000+00:00
          exclude:
          - null
          - null
        page_size: 15
      properties:
        selectors:
          $ref: "#/components/schemas/Selectors"
        page:
          default: 1
          minimum: 1
          type: integer
        page_size:
          default: 50
          maximum: 100
          minimum: 1
          type: integer
        order_by:
          default: id
          enum:
          - id
          - created_at
          - name
          - file_size
          - page_count
          - is_valid
          - source_document
          type: string
        order_dir:
          default: asc
          enum:
          - asc
          - desc
          type: string
      type: object
    DocumentSummary:
      additionalProperties: false
      example:
        document_class: document_class
        has_active_workflow: true
        organization_id: organization_id
        is_valid: true
        name: name
        created_at: 2000-01-23T04:56:07.000+00:00
        source_document: 5
        id: 0
        file_size: 6
        page_count: 1
      properties:
        id:
          type: integer
        organization_id:
          type: string
        name:
          type: string
        file_size:
          nullable: true
          type: integer
        page_count:
          nullable: true
          type: integer
        is_valid:
